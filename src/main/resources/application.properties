spring.application.name=finantial-manager
spring.mvc.servlet.path=/api/v1

# Database Connection
# COCKROACHBD intentionally uses the PostgreSQL driver, so we can use it here.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:26257/${POSTGRES_DB:finantial_manager}?sslmode=disable
spring.datasource.username=${POSTGRES_USER:finantial}
spring.datasource.password=${POSTGRES_PASSWORD:pizzaDeBatata}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.CockroachDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# CORS configuration
app.cors.origins=http://localhost:3000